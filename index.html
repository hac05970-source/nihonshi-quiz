<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社会科 年代・学習クイズ</title>
  <link rel="stylesheet" href="styles.css?v=20261125-mountains">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">入試頻出・社会科まとめ</p>
        <h1>社会科 学習クイズ</h1>
      </div>
      <div class="score" aria-live="polite"><span id="score">0</span><small>点</small></div>
    </header>

    <section id="setup" class="panel setup">
      <h2>出題設定</h2>
      <fieldset>
        <legend>ジャンルを選択</legend>
        <div class="genre-list">
          <label><input type="radio" name="genre" value="history" checked><span>歴史</span></label>
          <label><input type="radio" name="genre" value="geography"><span>地理</span></label>
          <label><input type="radio" name="genre" value="civics"><span>公民</span></label>
          <label><input type="radio" name="genre" value="current"><span>時事</span></label>
          <label><input type="radio" name="genre" value="mix"><span>総合学習</span></label>
        </div>
      </fieldset>
      <div id="construction" class="construction" hidden>
        <div class="construction-icon" aria-hidden="true">工事中</div>
        <h3 id="construction-title">準備中です</h3>
        <p>問題を追加して公開予定です。今は「歴史」で学習できます。</p>
      </div>
      <div id="genre-settings" hidden>
        <fieldset>
          <legend id="category-legend">分野を選択</legend>
          <div id="category-list" class="era-list"></div>
        </fieldset>
        <fieldset>
          <legend>出題モード</legend>
          <div class="segmented course-segmented">
            <label><input type="radio" name="genre-course" value="normal" checked><span>通常出題</span></label>
            <label><input type="radio" name="genre-course" value="review"><span>間違えた問題を復習（<b id="genre-wrong-count">0</b>問）</span></label>
          </div>
        </fieldset>
        <button id="clear-genre-wrong-button" class="text-button" type="button">復習履歴を削除</button>
        <div class="setup-actions">
          <button id="genre-start-button" class="primary" type="button">10問を開始</button>
        </div>
      </div>
      <div id="history-settings">
      <fieldset>
        <legend>時代を選択</legend>
        <div id="era-list" class="era-list"></div>
      </fieldset>
      <fieldset>
        <legend>クイズ形式</legend>
        <div class="segmented">
          <label><input type="radio" name="mode" value="year" checked><span>出来事 → 年代</span></label>
          <label><input type="radio" name="mode" value="event"><span>年代 → 出来事</span></label>
          <label><input type="radio" name="mode" value="mix"><span>ミックス</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>出題モード</legend>
        <div class="segmented course-segmented">
          <label><input type="radio" name="course" value="normal" checked><span>通常出題</span></label>
          <label><input type="radio" name="course" value="review"><span>間違えた問題を復習（<b id="wrong-count">0</b>問）</span></label>
        </div>
      </fieldset>
      <button id="clear-wrong-button" class="text-button" type="button">復習履歴を削除</button>
      <div class="setup-actions">
        <button id="start-button" class="primary" type="button">10問を開始</button>
      </div>
      </div>
    </section>

    <section id="quiz" class="panel quiz" hidden>
      <div class="quiz-meta">
        <span id="era-label"></span>
        <span id="progress-label"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="timer-row">
        <span>残り時間</span>
        <strong id="timer-label">10秒</strong>
      </div>
      <div class="timer-bar"><div id="timer-bar"></div></div>
      <h2 id="question"></h2>
      <div id="question-image" class="question-image" hidden>
        <img id="question-image-element" src="" alt="">
        <p id="question-image-caption"></p>
      </div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden>
        <p id="feedback-text"></p>
        <button id="next-button" class="primary" type="button">次の問題</button>
      </div>
    </section>

    <section id="result" class="panel result" hidden>
      <p class="eyebrow">RESULT</p>
      <h2 id="result-score"></h2>
      <p id="result-message"></p>
      <div class="setup-actions">
        <button id="retry-button" class="primary" type="button">もう一度</button>
        <button id="back-button" class="secondary" type="button">設定に戻る</button>
      </div>
    </section>
  </main>

  <script src="quiz-data.js?v=20261125-mountains"></script>
  <script src="geography-data.js?v=20261125-mountains"></script>
  <script src="civics-data.js?v=20261125-mountains"></script>
  <script src="current-data.js?v=20261125-mountains"></script>
  <script src="script.js?v=20261125-mountains"></script>
</body>
</html>
